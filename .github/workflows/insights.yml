name: Pull insights
on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6am Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commits   # don't race the publisher when pushing
  cancel-in-progress: false
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Pull
        env:
          IG_TOKEN_IMAGEHOUND: ${{ secrets.IG_TOKEN_IMAGEHOUND }}
          IG_TOKEN_MGI: ${{ secrets.IG_TOKEN_MGI }}
        run: igmeta insights --out insights
      - name: Keep Supabase awake
        # Free Supabase projects pause after 7 days without database activity,
        # and a paused project stops serving images to Meta. Harmless on Pro.
        if: ${{ vars.SUPABASE_URL != '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -fsS -o /dev/null -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "${SUPABASE_URL%/}/rest/v1/"
          echo ok
      - name: Save
        run: |
          git add insights
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "image-hound-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Instagram insights $(date -u +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

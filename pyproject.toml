[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-hound-meta"
version = "0.1.0"
description = "Queue, publish and measure Image Hound's Instagram posts through Meta's Instagram API."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
igmeta = "igmeta.cli:main"

[tool.setuptools.packages.find]
include = ["igmeta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
